name: Monthly Crawl & Deploy

on:
  schedule:
    - cron: "0 3 1 * *" # 每月1号 UTC 03:00
  workflow_dispatch: # 手动触发

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install

      - name: Crawl articles
        run: npx tsx scripts/crawl-and-build.ts

      - name: Build static site
        run: npx next build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=apollo-database

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles-cache.json
          git diff --cached --quiet || git commit -m "chore(data): update articles cache [$(date -u +%Y-%m-%d)]"
          git push
