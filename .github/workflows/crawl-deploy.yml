name: Monthly Crawl & Deploy

on:
  schedule:
    - cron: "0 3 1 * *" # 每月1号 UTC 03:00
  workflow_dispatch: # 手动触发

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn

      - run: yarn install

      - name: Crawl articles
        run: npx tsx scripts/crawl-and-build.ts

      - name: Build static site
        run: npx next build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=apollo-database

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles-cache.json
          git diff --cached --quiet || git commit -m "chore(data): update articles cache [$(date -u +%Y-%m-%d)]"
          git push
